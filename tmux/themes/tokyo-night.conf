# Tokyo Night (Night) — tmux status line，使用官方 hex palette
#
# Palette:
#   bg       #1a1b26    fg       #c0caf5
#   bg-alt   #24283b    fg-alt   #565f89
#   red      #f7768e    green    #9ece6a
#   yellow   #e0af68    blue     #7aa2f7
#   magenta  #bb9af7    cyan     #7dcfff
#   border   #414868

# --- status bar base ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 120

# --- left: session badge（Nerd Font  terminal icon）+ prefix 指示 ---
# prefix 按下時亮 `󰠠`（閃電/鈴）；未按時顯示 dim `󰤂`
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]   #S #[bg=#1a1b26,fg=#7aa2f7,nobold] #{?client_prefix,#[fg=#e0af68]󰠠,#[fg=#565f89]󰤂} "

# --- right: cwd + git pill（coralline 風格，statusline-info.sh 產生）+ time pill ---
# 色碼參數不含 #（腳本會補），依序：dir_bg git_ok_bg git_dirty_bg text_fg bar_bg
set -g status-right "#(~/.config/tmux/statusline-info.sh '#{pane_current_path}' 7aa2f7 9ece6a e0af68 1a1b26 1a1b26) #[fg=#7dcfff,bg=#1a1b26]#[bg=#7dcfff,fg=#1a1b26,bold] %H:%M #[nobold]#[fg=#7dcfff,bg=#1a1b26]#[default] "

# --- window list ---
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[bg=#bb9af7,fg=#1a1b26,bold] #I:#W #[nobold]#[fg=#bb9af7,bg=#1a1b26]"
set -g window-status-style "bg=#1a1b26,fg=#c0caf5"
set -g window-status-current-style "bg=#bb9af7,fg=#1a1b26,bold"
set -g window-status-activity-style "bg=#1a1b26,fg=#e0af68,bold"
set -g window-status-bell-style "bg=#1a1b26,fg=#f7768e,bold"

# --- pane borders ---
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# --- message / command prompt ---
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#7aa2f7,fg=#1a1b26,bold"

# --- mode (copy mode selection) ---
set -g mode-style "bg=#7aa2f7,fg=#1a1b26,bold"

# --- clock ---
set -g clock-mode-colour "#7aa2f7"
