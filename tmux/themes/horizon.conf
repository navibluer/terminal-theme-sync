# Horizon theme — 固定 hex palette，不受 terminal theme 影響
# 參考 horizontheme.netlify.app
#
# Palette:
#   bg       #1c1e26    fg       #cbced0
#   bg-alt   #232530    fg-alt   #6e6a86
#   red      #e95678    cyan     #26bbd9
#   pink     #ee64ac    orange   #f09383
#   yellow   #fab795    green    #29d398
#   magenta  #b877db    border   #2e303e

# --- status bar base ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#24262e,fg=#cbced0"
set -g status-left-length 40
set -g status-right-length 120

# --- left: session badge（Nerd Font  terminal icon）+ prefix 指示 ---
# prefix 按下時亮 `󰠠`（閃電/鈴）；未按時顯示 dim `󰤂`
set -g status-left "#[bg=#e95678,fg=#1c1e26,bold]   #S #[bg=#24262e,fg=#e95678,nobold] #{?client_prefix,#[fg=#fab795]󰠠,#[fg=#6e6a86]󰤂} "

# --- right: cwd + git pill（coralline 風格，statusline-info.sh 產生）+ time pill ---
# 色碼參數不含 #（腳本會補），依序：dir_bg git_ok_bg git_dirty_bg text_fg bar_bg
set -g status-right "#(~/.config/tmux/statusline-info.sh '#{pane_current_path}' b877db 29d398 f09383 1c1e26 24262e) #[fg=#2e303e,bg=#24262e]#[bg=#2e303e,fg=#cbced0,bold] %H:%M #[nobold]#[fg=#2e303e,bg=#24262e]#[default] "

# --- window list ---
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#26bbd9,bg=#24262e]#[bg=#26bbd9,fg=#1c1e26,bold] #I:#W #[nobold]#[fg=#26bbd9,bg=#24262e]"
set -g window-status-style "bg=#24262e,fg=#cbced0"
set -g window-status-current-style "bg=#26bbd9,fg=#1c1e26,bold"
set -g window-status-activity-style "bg=#24262e,fg=#fab795,bold"
set -g window-status-bell-style "bg=#24262e,fg=#e95678,bold"

# --- pane borders ---
set -g pane-border-style "fg=#2e303e"
set -g pane-active-border-style "fg=#26bbd9"

# --- message / command prompt ---
set -g message-style "bg=#26bbd9,fg=#1c1e26,bold"
set -g message-command-style "bg=#26bbd9,fg=#1c1e26,bold"

# --- mode (copy mode selection) ---
set -g mode-style "bg=#26bbd9,fg=#1c1e26,bold"

# --- clock ---
set -g clock-mode-colour "#26bbd9"
