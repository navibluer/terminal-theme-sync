# Gruvbox Dark (medium) — tmux status line，使用官方 hex palette
#
# Palette:
#   bg       #282828    fg       #ebdbb2
#   bg-alt   #3c3836    fg-alt   #a89984
#   gray     #928374    border   #504945
#   red      #fb4934    green    #b8bb26
#   yellow   #fabd2f    blue     #83a598
#   purple   #d3869b    aqua     #8ec07c
#   orange   #fe8019

# --- status bar base ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 120

# --- left: session badge（黃色為 gruvbox 招牌色）+ prefix 指示 ---
set -g status-left "#[bg=#fabd2f,fg=#282828,bold]    #S #[bg=#282828,fg=#fabd2f,nobold] #{?client_prefix,#[fg=#fe8019]󰠠,#[fg=#928374]󰤂} "

# --- right: cwd + git pill（coralline 風格，statusline-info.sh 產生）+ time pill ---
# 色碼參數不含 #（腳本會補），依序：dir_bg git_ok_bg git_dirty_bg text_fg bar_bg
set -g status-right "#(~/.config/tmux/statusline-info.sh '#{pane_current_path}' 458588 689d6a d65d0e ebdbb2 282828) #[fg=#504945,bg=#282828]#[bg=#504945,fg=#ebdbb2,bold] %H:%M #[nobold]#[fg=#504945,bg=#282828]#[default] "

# --- window list ---
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#fe8019,bg=#282828]#[bg=#fe8019,fg=#282828,bold] #I:#W #[nobold]#[fg=#fe8019,bg=#282828]"
set -g window-status-style "bg=#282828,fg=#ebdbb2"
set -g window-status-current-style "bg=#fe8019,fg=#282828,bold"
set -g window-status-activity-style "bg=#282828,fg=#fabd2f,bold"
set -g window-status-bell-style "bg=#282828,fg=#fb4934,bold"

# --- pane borders ---
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

# --- message / command prompt ---
set -g message-style "bg=#fabd2f,fg=#282828,bold"
set -g message-command-style "bg=#fabd2f,fg=#282828,bold"

# --- mode (copy mode selection) ---
set -g mode-style "bg=#fabd2f,fg=#282828,bold"

# --- clock ---
set -g clock-mode-colour "#fabd2f"
