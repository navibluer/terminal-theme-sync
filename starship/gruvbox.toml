# Starship — Gruvbox-faithful prompt
# 識別色：暖橘 + 沙黃 + 米黃綠（復古暖色暗主題）

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

# Gruvbox directory：黃 #fabd2f（gruvbox 最具識別度的暖黃，與編輯器 type/keyword 一致）
[directory]
style = "bold #fabd2f"

# Gruvbox branch：aqua #8ec07c（gruvbox 招牌青苔綠，比 purple 更具識別）
[git_branch]
style = "bold #8ec07c"
symbol = " "

# Gruvbox git_status：橘 #fe8019（gruvbox 警示橘）
[git_status]
style = "bold #fe8019"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"
vimcmd_symbol = "[❮](bold #b8bb26)"

