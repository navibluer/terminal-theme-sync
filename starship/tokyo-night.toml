# Starship — Tokyo Night-faithful prompt
# 識別色：deep blue + 紫羅蘭（冷色深藍主題，directory 用 blue 不是 cyan）

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

# Tokyo Night directory：藍 #7aa2f7（Tokyo Night 的識別 blue，與編輯器 function name 一致）
[directory]
style = "bold #7aa2f7"

# Tokyo Night branch：紫羅蘭 #bb9af7（Tokyo Night 招牌 purple）
[git_branch]
style = "bold #bb9af7"
symbol = " "

# Tokyo Night git_status：紅 #f7768e
[git_status]
style = "bold #f7768e"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"

