# Starship — Horizon-faithful prompt
# 識別色：coral red + 亮 cyan + 桃紅 magenta（暖色暗主題）

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

# Horizon directory：亮 cyan #59E1E3（官方 cyan，與 VSCode/Vim Horizon 主題的 path 一致）
[directory]
style = "bold #59E1E3"

# Horizon branch：桃紅 magenta #EE64AC（比預設 purple 更貼 Horizon 識別）
[git_branch]
style = "bold #EE64AC"
symbol = " "

# Horizon git_status：coral red #E95678（Horizon 招牌色）
[git_status]
style = "bold #E95678"

[character]
success_symbol = "[❯](bold #29D398)"
error_symbol = "[❯](bold #E95678)"
vimcmd_symbol = "[❮](bold #29D398)"

